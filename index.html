<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef's Kiss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#04191F;--glow:#7FE3D4;--lantern:#F2C14E;--anemone:#E8657C;--sand:#EFDCB8;--line:color-mix(in srgb, var(--glow) 22%, transparent)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--ink);
  color:var(--sand);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
#game{height:100dvh;display:grid;grid-template-rows:auto 1fr}

header{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:.6rem 1.1rem;
  border-bottom:1px solid var(--line);background:var(--ink);position:relative;z-index:40}
.sign{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:1.15rem;letter-spacing:-.015em;
  color:var(--glow);white-space:nowrap;font-variation-settings:'SOFT' 60,'WONK' 1}
.sign em{font-style:normal;color:var(--lantern)}
.stats{display:flex;gap:.9rem;margin-left:auto;align-items:center;font-size:.88rem;flex-wrap:wrap}
.stat b{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem}
.stat span{opacity:.55;font-size:.76rem}
#shellCount{color:var(--lantern)}
#streakCount{color:var(--glow)}
.switch{display:flex;align-items:center;gap:.45rem;font-size:.8rem;opacity:.85}
.track{width:38px;height:21px;border-radius:99px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);position:relative;transition:background .18s,border-color .18s;flex:none}
.track .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--sand);opacity:.55;transition:transform .18s,opacity .18s,background .18s}
.switch[aria-checked="true"] .track{background:color-mix(in srgb, var(--glow) 22%, transparent);border-color:var(--glow)}
.switch[aria-checked="true"] .knob{transform:translateX(17px);background:var(--glow);opacity:1}
.topBtn{border:1px solid var(--line);border-radius:999px;padding:.32rem .85rem;font-size:.83rem;
  font-weight:500;color:var(--glow);transition:background .15s,border-color .15s}
.topBtn:hover{background:color-mix(in srgb, var(--glow) 10%, transparent);border-color:var(--glow)}
.topBtn.nudge{border-color:var(--lantern);color:var(--lantern)}
.topBtn:disabled{opacity:.32;cursor:not-allowed}
.topBtn:disabled:hover{background:none;border-color:var(--line)}
.morning{border:1px solid color-mix(in srgb, var(--lantern) 45%, transparent);border-radius:14px;padding:.8rem .95rem;
  margin-bottom:.9rem;background:linear-gradient(180deg,color-mix(in srgb, var(--lantern) 12%, transparent),color-mix(in srgb, var(--lantern) 3%, transparent));flex:none}
.morning h2{font-family:'Fraunces',serif;font-weight:900;font-size:1.1rem;color:var(--lantern);margin-bottom:.3rem}
.morning p{font-size:.81rem;line-height:1.5;opacity:.8}
.morning p+p{margin-top:.35rem}
.morning .arrived{color:var(--glow);opacity:.95}
.onOrder{color:var(--lantern);opacity:.9}
.finale{text-align:center;padding:1.2rem .5rem 1.6rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
.finale .fKiss{font-size:3rem;line-height:1;margin-bottom:.6rem}
.finale h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.6rem,4vw,2.6rem);
  line-height:1.1;color:var(--lantern);margin-bottom:.5rem}
.finale .fLead{font-size:.95rem;opacity:.8;max-width:46ch;margin:0 auto 1.1rem;line-height:1.55}
.fList{display:flex;flex-direction:column;gap:.35rem;max-width:34rem;margin:0 auto 1rem}
.fRow{display:flex;gap:.7rem;align-items:baseline;justify-content:center;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:.35rem;font-size:.82rem}
.fRow .fL{color:var(--lantern);font-weight:600}
.fRow .fN{font-family:'Fraunces',serif;font-weight:700}
.fRow .fS{opacity:.6;font-size:.76rem}
.fTotals{font-size:.85rem;opacity:.8;margin-bottom:1rem}
.fTotals b{font-family:'Fraunces',serif;color:var(--glow);font-size:1rem}
.fEnd{font-family:'Fraunces',serif;font-weight:900;font-size:1.3rem;color:var(--glow);margin-bottom:.4rem}
.fSmall{font-size:.78rem;opacity:.55}
.fBanner{color:var(--lantern);font-weight:600;margin-top:.5rem}
.linkBtn{color:var(--glow);text-decoration:underline;text-underline-offset:2px;font-size:.81rem}
.linkBtn:hover{color:var(--lantern)}

main{display:grid;grid-template-columns:1fr 350px;min-height:0}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #side{border-left:none;border-top:1px solid var(--line);max-height:56dvh;overflow-y:auto}
  #log{max-height:7rem}
}

/* pantry */
#pantry{position:relative;overflow-y:auto;padding:1rem 1.15rem 2rem;
  background:radial-gradient(120% 90% at 50% 108%,var(--panglow) 0%,transparent 60%),
    linear-gradient(180deg,var(--ink) 0%,var(--pan1) 60%,var(--pan2) 100%)}
.pHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.7rem;gap:1rem;flex-wrap:wrap}
.pTitle{font-family:'Fraunces',serif;font-weight:900;font-size:1.05rem;color:var(--glow)}
.pSub{font-size:.78rem;opacity:.55}
.grid{display:grid;gap:.55rem;grid-template-columns:repeat(4,1fr)}
@media (min-width:1250px){.grid{grid-template-columns:repeat(6,1fr)}}
@media (max-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.mGrid{display:grid;gap:.6rem;grid-template-columns:repeat(6,1fr)}
@media (max-width:1000px){.mGrid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:640px){.mGrid{grid-template-columns:repeat(3,1fr)}}
.mCard{border:1px solid var(--line);border-radius:14px;padding:.55rem .5rem;text-align:center;
  background:color-mix(in srgb, var(--glow) 5%, transparent);display:flex;flex-direction:column;gap:.15rem}
.mCard .mE{font-size:1.5rem;line-height:1.1}
.mCard .mN{font-weight:600;font-size:.82rem}
.mCard .mT{font-size:.63rem;opacity:.55;color:var(--glow);line-height:1.3}
.mCard .mP{font-family:'Fraunces',serif;font-weight:700;font-size:.9rem;color:var(--lantern);margin-top:.15rem}
.mCard .mS{font-size:.63rem;opacity:.6}
.mCard .mB{display:flex;gap:.3rem;margin-top:.35rem}
.mCard .mB button{flex:1;border:1px solid var(--line);border-radius:8px;padding:.2rem 0;
  font-size:.75rem;font-weight:600;color:var(--lantern)}
.mCard .mB button:hover:not(:disabled){background:var(--lantern);color:var(--ink)}
.mCard .mB button:disabled{opacity:.25;cursor:not-allowed}
.mCard .mSell{color:var(--glow);font-family:'Jost',sans-serif;font-weight:500;font-size:.78rem;opacity:.85}
.pIng{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;
  border:1px solid var(--line);border-radius:14px;padding:.55rem .65rem;position:relative;
  background:color-mix(in srgb, var(--glow) 5%, transparent);transition:background .13s,border-color .13s,transform .07s}
.pIng:hover:not(:disabled){background:color-mix(in srgb, var(--glow) 14%, transparent);border-color:var(--glow)}
.pIng:active:not(:disabled){transform:translateY(1px)}
.pIng:disabled{opacity:.3;cursor:not-allowed}
.pIng .pE{font-size:1.5rem;line-height:1.1}
.pIng .pN{font-weight:600;font-size:.85rem}
.pIng .pT{font-size:.66rem;opacity:.6;color:var(--glow)}
.pIng .pV{font-size:.63rem;color:var(--lantern);opacity:.8;margin-top:.05rem}
.pIng .pC{position:absolute;top:.5rem;right:.6rem;font-family:'Fraunces',serif;font-weight:700;
  font-size:.95rem;color:var(--lantern)}
.pIng.out .pC{color:var(--anemone)}
.empty{opacity:.55;font-size:.88rem;line-height:1.6;max-width:44ch;margin-top:.5rem}
.floatText{position:fixed;pointer-events:none;font-family:'Fraunces',serif;font-weight:700;font-size:1.5rem;
  color:var(--lantern);animation:rise 1.2s ease-out forwards;text-shadow:0 2px 10px var(--ink);z-index:50}
@keyframes rise{from{transform:translate(-50%,-50%);opacity:1}
  to{transform:translate(-50%,-50%) translateY(-54px);opacity:0}}

/* side */
#side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);
  background:linear-gradient(180deg,var(--deep),var(--ink))}
.card{padding:.85rem 1.05rem;border-bottom:1px solid var(--line)}
.cardHead{font-family:'Fraunces',serif;font-weight:700;font-size:.8rem;color:var(--glow);opacity:.8;
  margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:baseline}
.cardHead .side{font-family:'Jost',sans-serif;font-weight:400;font-size:.72rem;opacity:.7;color:var(--sand)}
#customer{display:flex;gap:.8rem;align-items:flex-start}
.face{font-size:1.9rem;width:2.8rem;height:2.8rem;flex:none;border-radius:50%;display:grid;
  place-items:center;background:color-mix(in srgb, var(--glow) 9%, transparent);border:1px solid var(--line)}
.face.vip{border-color:var(--lantern);background:color-mix(in srgb, var(--lantern) 14%, transparent);box-shadow:0 0 16px color-mix(in srgb, var(--lantern) 25%, transparent)}
.who{font-family:'Fraunces',serif;font-weight:700;font-size:1rem}
.who .badge{font-family:'Jost',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.04em;
  color:var(--lantern);border:1px solid color-mix(in srgb, var(--lantern) 50%, transparent);border-radius:99px;padding:.05rem .4rem;
  margin-left:.4rem;vertical-align:.12em}
.order{font-size:.87rem;line-height:1.45;opacity:.88;margin-top:.15rem}
.order b{color:var(--glow);font-weight:600}
.order i{font-style:normal;color:var(--anemone);font-weight:600}
.order u{text-decoration:none;color:var(--lantern);font-weight:600}
.patience{height:5px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:.55rem;overflow:hidden}
.patience>i{display:block;height:100%;background:var(--glow);transition:width .2s linear,background .3s}
.patience.low>i{background:var(--anemone)}
.noRush{font-size:.72rem;opacity:.45;margin-top:.5rem}
.peek{font-size:.75rem;opacity:.6;margin-top:.55rem;border-top:1px dashed var(--line);padding-top:.45rem}
.peek b{color:var(--glow);opacity:.9}
.slots{display:flex;gap:.45rem;flex-wrap:wrap}
.slot{width:2.9rem;height:2.9rem;border-radius:14px;border:1px dashed var(--line);display:grid;
  place-items:center;font-size:1.4rem;position:relative;background:color-mix(in srgb, var(--glow) 4%, transparent)}
.slot.full{border-style:solid;border-color:color-mix(in srgb, var(--glow) 50%, transparent);background:color-mix(in srgb, var(--glow) 10%, transparent);cursor:pointer}
.slot .tip{position:absolute;bottom:-.05rem;left:0;right:0;text-align:center;font-size:.5rem;
  color:var(--glow);opacity:.7;overflow:hidden;white-space:nowrap}
.acts{display:flex;gap:.5rem;margin-top:.7rem}
.btn{flex:1;border-radius:11px;padding:.48rem .6rem;font-size:.87rem;font-weight:500;
  border:1px solid var(--line);color:var(--glow);transition:background .15s,transform .08s}
.btn:hover:not(:disabled){background:color-mix(in srgb, var(--glow) 12%, transparent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.go{background:var(--glow);color:var(--ink);border-color:var(--glow);font-weight:600}
.btn.go:hover:not(:disabled){background:color-mix(in srgb, var(--glow) 78%, white)}
.btn.ghost{color:var(--sand);opacity:.55}
#plate{display:none}
#plate.on{display:block}
.dish{border:1px solid color-mix(in srgb, var(--lantern) 40%, transparent);border-radius:14px;padding:.7rem .85rem;
  background:linear-gradient(180deg,color-mix(in srgb, var(--lantern) 11%, transparent),color-mix(in srgb, var(--lantern) 3%, transparent))}
.dishName{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;line-height:1.25;color:var(--lantern)}
.dishTags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.45rem}
.tag{font-size:.67rem;padding:.13rem .44rem;border-radius:99px;border:1px solid var(--line);
  color:var(--glow);opacity:.7}
.tag.hit{background:var(--glow);color:var(--ink);border-color:var(--glow);opacity:1;font-weight:600}
.tag.bad{background:var(--anemone);color:#fff;border-color:var(--anemone);opacity:1;font-weight:600}
.known{font-size:.7rem;color:var(--lantern);opacity:.85;margin-top:.4rem}
.known.fresh{color:var(--glow)}
#log{flex:1;overflow-y:auto;padding:.7rem 1.05rem 1.2rem;font-size:.79rem;line-height:1.55;min-height:0}
#log p{opacity:.68;margin-bottom:.32rem}
#log p.good{color:var(--glow);opacity:.95}
#log p.bad{color:var(--anemone);opacity:.95}
#log p.day{color:var(--lantern);font-family:'Fraunces',serif;font-weight:700;opacity:1;margin:.6rem 0 .35rem}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(2,12,16,.85);
  backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:1.1rem}
#modal.on{display:flex}
#modal.full{padding:0}
#modal.full .box{width:100%;max-width:none;height:100dvh;max-height:none;border-radius:0;
  padding:1.1rem clamp(1rem,4vw,2.5rem) 1.1rem}
.box{width:min(680px,100%);max-height:88dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--deep2),var(--deep));border:1px solid var(--line);
  border-radius:20px;padding:1.2rem}
.tabs{display:flex;gap:.5rem;margin-bottom:.9rem;flex:none;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-radius:99px;padding:.32rem .95rem;font-size:.85rem;
  color:var(--sand);opacity:.6}
.tab.on{opacity:1;color:var(--glow);border-color:var(--glow);background:color-mix(in srgb, var(--glow) 10%, transparent)}
.pane{overflow-y:auto;flex:1;min-height:0}
.pane[hidden]{display:none}
.note{font-size:.8rem;opacity:.62;margin-bottom:.75rem;line-height:1.5}

.mRow{display:flex;gap:.7rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.mRow .ic{font-size:1.35rem;width:1.9rem;text-align:center;flex:none}
.mRow .txt{flex:1;min-width:0}
.mRow .t{font-weight:600;font-size:.92rem}
.mRow .d{font-size:.75rem;opacity:.6;line-height:1.4}
.mRow .have{font-family:'Fraunces',serif;font-weight:700;color:var(--lantern);font-size:.95rem;
  width:2.6rem;text-align:right;flex:none}
.buy{border:1px solid var(--lantern);color:var(--lantern);border-radius:99px;padding:.28rem .6rem;
  font-size:.78rem;font-weight:600;white-space:nowrap;flex:none}
.buy:hover:not(:disabled){background:var(--lantern);color:var(--ink)}
.buy:disabled{opacity:.26;cursor:not-allowed}
.groupHead{font-family:'Fraunces',serif;font-weight:700;font-size:.85rem;color:var(--glow);opacity:.85;
  margin:.9rem 0 .1rem;display:flex;justify-content:space-between;align-items:baseline}
.groupHead .g2{font-family:'Jost',sans-serif;font-weight:400;font-size:.73rem;opacity:.65;color:var(--sand)}
.wallet{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  border:1px solid var(--line);border-radius:12px;padding:.45rem .8rem;margin-bottom:.9rem;
  background:color-mix(in srgb, var(--lantern) 7%, transparent);flex:none}
.wallet b{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;color:var(--lantern)}
.wallet span{font-size:.76rem;opacity:.6}
.mv{font-size:.7rem;margin-left:.35rem}
.mv.up{color:var(--anemone)}
.mv.dn{color:var(--glow)}
.bulkBar{display:flex;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.rec{display:flex;gap:.6rem;align-items:baseline;font-size:.81rem;padding:.13rem 0}
.rec .rn{font-weight:600;min-width:10.5rem;flex:none}
.rec .ri{opacity:.55;font-size:.74rem}
.rec.locked .rn{opacity:.3;font-weight:400;font-style:italic}
.rec.locked .ri{opacity:.28}
.rec.improv .rn{color:var(--sand);font-weight:500}
.closeBtn{margin-top:1rem;padding:.55rem;border:1px solid var(--line);border-radius:12px;
  color:var(--sand);width:100%;flex:none}
.closeBtn:hover{background:rgba(255,255,255,.05)}
@media (prefers-reduced-motion:reduce){.floatText{animation-duration:.01ms}}
</style>
</head>
<body>
<div id="game">
  <header>
    <div class="sign">The Deep <em>End</em></div>
    <div class="stats">
      <div class="stat"><b id="shellCount">0</b> <span id="curLabel">shells</span></div>
      <div class="stat"><b id="levelCount">1</b> <span>level</span></div>
      <div class="stat"><b id="dayCount">1</b> <span>day</span></div>
      <div class="stat"><b id="servedCount">0</b> <span>served</span></div>
      <div class="stat"><b id="streakCount">0</b> <span>streak</span></div>
      <button class="topBtn" id="btnStock">Truck order</button>
      <button class="topBtn" id="btnUp">Upgrades</button>
      <button class="topBtn" id="btnBook">Recipe book</button>
    </div>
  </header>

  <main>
    <section id="pantry" aria-label="Pantry">
      <div class="pHead">
        <div>
          <div class="pTitle">Pantry</div>
          <div class="pSub" id="pantrySub"></div>
        </div>
      </div>
      <div class="grid" id="pantryGrid"></div>
      <div class="empty" id="pantryEmpty" hidden></div>
    </section>

    <aside id="side">
      <div class="card">
        <div class="cardHead">At the counter</div>
        <div id="customer">
          <div class="face" id="cFace">🐟</div>
          <div style="flex:1;min-width:0">
            <div class="who" id="cName">—</div>
            <div class="order" id="cOrder">…</div>
            <div class="patience" id="cPatience"><i style="width:100%"></i></div>
            <div class="noRush" id="cNoRush" hidden>No rush — they'll wait as long as it takes.</div>
          </div>
        </div>
        <div class="acts"><button class="btn ghost" id="waveBtn">Wave them off</button></div>
      </div>

      <div class="card">
        <div class="cardHead">Prep bowl <span class="side" id="bowlHint"></span></div>
        <div class="slots" id="slots"></div>
        <div class="acts">
          <button class="btn" id="combineBtn" disabled>Combine</button>
          <button class="btn ghost" id="clearBtn" disabled>Tip out</button>
        </div>
      </div>

      <div class="card" id="plate">
        <div class="cardHead">On the plate</div>
        <div class="dish">
          <div class="dishName" id="dishName"></div>
          <div class="dishTags" id="dishTags"></div>
          <div class="known" id="dishKnown"></div>
        </div>
        <div class="acts">
          <button class="btn go" id="serveBtn">Serve it</button>
          <button class="btn ghost" id="binBtn">Bin it</button>
        </div>
      </div>

      <div id="log"></div>
    </aside>
  </main>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-label="Morning orders">
  <div class="box">
    <div class="morning" id="morningBox" hidden></div>
    <div class="tabs">
      <button class="tab on" id="tabStock">Truck order</button>
      <button class="tab" id="tabUp">Upgrades</button>
      <button class="tab" id="tabBook">Recipe book</button>
    </div>
    <div class="wallet"><span id="walletCtx">Today's prices</span><b id="walletShells">0</b></div>
    <div class="pane" id="paneStock">
      <div class="note" id="stockNote"></div>
      <div class="bulkBar" id="bulkBar"></div>
      <div id="market"></div>
    </div>
    <div class="pane" id="paneUp" hidden>
      <div class="note">Permanent improvements, fitted the next morning. You can order one level of each per day.</div>
      <div id="upgrades"></div>
    </div>
    <div class="pane" id="paneBook" hidden>
      <div class="note" id="bookNote"></div>
      <div id="book"></div>
    </div>
    <button class="closeBtn" id="closeBtn">Back to the counter</button>
  </div>
</div>

<script>
"use strict";

/* ============================ DATA ============================ */

const TAG_WORDS = {sweet:"sweet",salty:"salty",sour:"sour",spicy:"spicy",creamy:"creamy",
  crunchy:"crunchy",fresh:"fresh",briny:"briny",rich:"rich",cold:"cold",
  smoky:"smoky",bitter:"bitter",herbal:"herbal",chewy:"chewy"};

/* ---------- world 1: The Deep End ---------- */
const W1_ING = [
  {id:"kelp",n:"Kelp",e:"🌿",tier:0,tags:["fresh","briny"]},
  {id:"shrimp",n:"Shrimp",e:"🦐",tier:0,tags:["briny","rich"]},
  {id:"rice",n:"Rice",e:"🍚",tier:0,tags:["creamy","chewy"]},
  {id:"lemon",n:"Lemon",e:"🍋",tier:0,tags:["sour","fresh"]},
  {id:"egg",n:"Egg",e:"🥚",tier:0,tags:["rich","creamy"]},

let WORLD, INGREDIENTS, ING, MAX_TIER, TIER_NAMES, RECIPES, RECIPE_TOTAL,
    FORMS, CUSTOMERS, ASKS, UPGRADES;

function loadWorld(level){
  WORLD = WORLDS[Math.min(Math.max(level,1), WORLDS.length) - 1];
  INGREDIENTS = WORLD.ingredients;
  ING = Object.fromEntries(INGREDIENTS.map(i => [i.id, i]));
  MAX_TIER = Math.max(...INGREDIENTS.map(i => i.tier));
  TIER_NAMES = WORLD.tiers;
  FORMS = WORLD.forms;
  CUSTOMERS = WORLD.customers;
  ASKS = WORLD.asks;
  UPGRADES = WORLD.upgrades;
  RECIPES = {};
  WORLD.recipes.forEach(line => {
    const p = line.split("|");
    const ids = p[0].split(" ").sort();
    RECIPES[ids.join("|")] = {name:p[1], add:p[2].split(","), ids};
  });
  RECIPE_TOTAL = Object.keys(RECIPES).length;
  applyTheme();
}

function applyTheme(){
  const r = document.documentElement;
  Object.entries(WORLD.theme).forEach(([k,v]) => r.style.setProperty("--" + k, v));
  const sign = document.querySelector(".sign");
  if(sign) sign.innerHTML = WORLD.sign;
  document.title = "Chef's Kiss — " + WORLD.name;
  const cl = document.getElementById("curLabel");
  if(cl) cl.textContent = WORLD.currency;
}
const CUR = () => WORLD.currency;

const S = {
  level:1, shells:150, day:1, served:0, dayServed:0, streak:0,
  stock:{}, prices:{}, prevPrices:{}, sale:{}, phase:"morning",
  pendingStock:{}, pendingUp:{}, arrived:[], bowl:[], plate:null, customer:null, onDeck:null,
  found:new Set(), made:new Map(), timerOn:true, completed:false, history:[],
  up:{}, lastT:0
};

function resetForWorld(seed){
  S.shells = seed;
  S.day = 1; S.served = 0; S.dayServed = 0; S.streak = 0;
  S.stock = {}; S.pendingStock = {}; S.pendingUp = {}; S.arrived = [];
  S.bowl = []; S.plate = null; S.customer = null; S.onDeck = null;
  S.found = new Set(); S.made = new Map();
  S.up = {};
  UPGRADES.forEach(u => S.up[u.id] = 0);
  INGREDIENTS.forEach(i => S.stock[i.id] = i.tier === 0 ? 8 : 0);
  rollPrices();
}

const SAVE_KEY = "chefsKiss.save.v1";
let saveOK = true;
let saveTimer = null;

function saveGame(){
  if(!saveOK || wiping) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:1, level:S.level, completed:S.completed, history:S.history, shells:S.shells, day:S.day, served:S.served, dayServed:S.dayServed,
      streak:S.streak, stock:S.stock, prices:S.prices, prevPrices:S.prevPrices,
      phase:S.phase, pendingStock:S.pendingStock, pendingUp:S.pendingUp,
      arrived:S.arrived, timerOn:S.timerOn, up:S.up,
      found:[...S.found], made:[...S.made],
      bowl:S.bowl.map(i => i.id), plate:S.plate,
      customer:S.customer, onDeck:S.onDeck
    }));
  }catch(e){
    saveOK = false;
    note("This browser won't let the game save. Download the file and open it directly and progress will stick.", "bad");
  }
}

function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || d.v !== 1) return false;
    S.level = d.level || 1;
    loadWorld(S.level);
    ["shells","day","served","dayServed","streak","phase","timerOn","arrived",
     "stock","prices","prevPrices","pendingStock","pendingUp","up","plate","customer","onDeck",
     "completed","history"]
      .forEach(k => { if(d[k] !== undefined) S[k] = d[k]; });
    S.found = new Set(d.found || []);
    S.made  = new Map(d.made || []);
    S.bowl  = (d.bowl || []).map(id => ING[id]).filter(Boolean);
    INGREDIENTS.forEach(i => { if(typeof S.stock[i.id] !== "number") S.stock[i.id] = 0; });
    UPGRADES.forEach(u => { if(typeof S.up[u.id] !== "number") S.up[u.id] = 0; });
    return true;
  }catch(e){ return false; }
}

let wiping = false;

function wipeSave(){
  wiping = true;                       // stop the autosave and the beforeunload hook
  if(saveTimer) clearInterval(saveTimer);
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  // clear the running game too, in case the reload is blocked
  S.level = 1;
  loadWorld(1);
  resetForWorld(150);
  S.completed = false;
  S.history = [];
  S.found = new Set();
  S.made = new Map();
  location.reload();
}

const el = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];

const bowlSize = () => 3 + S.up.bowl;
const tipMult  = () => 1 + S.up.apron * 0.22;
const maxTier  = () => Math.min(S.up.crate, MAX_TIER);
const dayMult  = () => 1 + (S.day - 1) * 0.09;
const levelMult  = () => (WORLD && WORLD.mult) || 1;
const avoidFactor = () => Math.min(0.85, 0.35 + (S.up.cool || 0) * 0.10);
const pool     = () => INGREDIENTS.filter(i => i.tier <= maxTier());
const perDay   = () => 5 + Math.floor((S.day - 1) / 3);
const price     = ing => Math.max(2, Math.round((S.prices[ing.id] || 12) * (1 - S.up.bulk*0.08)));
const salePrice = ing => Math.max(1, S.sale[ing.id] || 1);
const priceLow  = () => (WORLD && WORLD.priceLow)  || 5;
const priceHigh = () => (WORLD && WORLD.priceHigh) || 30;

function rollPrices(){
  S.prevPrices = Object.assign({}, S.prices);
  const lo = priceLow(), span = priceHigh() - lo + 1;
  S.sale = {};
  INGREDIENTS.forEach(i => {
    const buy = lo + Math.floor(Math.random()*span);
    S.prices[i.id] = buy;
    // what it's worth on a plate today — its own roll, 1.3x to 2.6x what you paid
    S.sale[i.id] = Math.max(buy + 1, Math.round(buy * (1.3 + Math.random()*1.3)));
  });
}
const totalStock = () => Object.values(S.stock).reduce((a,b)=>a+b,0);

function patienceFor(vip){
  return (Math.max(11, 32 - (S.day-1)*1.4) * (1 + S.up.calm*0.16) * (vip ? 0.7 : 1)
         + pool().length) * 0.5;
}
function wantsCount(){
  if(S.day >= 14) return 4;
  if(S.day >= 8)  return 3;
  if(S.day >= 3)  return 2;
  return 1;
}
const upLevel  = id => S.up[id] + (S.pendingUp[id] || 0);
const onOrder  = id => S.pendingStock[id] || 0;

function hash(s){ let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; }

/* ============================ PANTRY ============================ */

function takeFromPantry(ing){
  if(S.plate){ note("Serve or bin the plate first."); return; }
  if(S.bowl.length >= bowlSize()){ note("The bowl is full — combine what you've got."); return; }
  if(S.stock[ing.id] <= 0){ note("No " + ing.n.toLowerCase() + " left. Restock at the supply crate."); return; }
  S.stock[ing.id]--;
  S.bowl.push(ing);
  drawPantry(); drawBowl();
}

function drawPantry(){
  const grid = el("pantryGrid");
  grid.innerHTML = "";
  const list = pool();
  list.forEach(ing => {
    const have = S.stock[ing.id];
    const b = document.createElement("button");
    b.className = "pIng" + (have <= 0 ? " out" : "");
    b.disabled = have <= 0;
    b.innerHTML =
      '<span class="pE" aria-hidden="true">' + ing.e + '</span>' +
      '<span class="pN">' + ing.n + '</span>' +
      '<span class="pT">' + ing.tags.map(t=>TAG_WORDS[t]).join(" · ") + '</span>' +
      '<span class="pV">' + salePrice(ing) + ' on the plate</span>' +
      '<span class="pC">' + have + '</span>';
    b.setAttribute("aria-label", ing.n + ", " + have + " in stock");
    b.addEventListener("click", () => takeFromPantry(ing));
    grid.appendChild(b);
  });
  el("pantrySub").textContent = list.length + " ingredients stocked · " + totalStock() +
    " units on the shelf · the amber figure is what each adds to the bill today";
  const emp = el("pantryEmpty");
  if(totalStock() === 0){
    emp.hidden = false;
    emp.textContent = "Every shelf is bare. Open the supply crate and buy stock — you can't cook without it.";
  } else emp.hidden = true;
}

/* ============================ COOKING ============================ */

function combine(){
  if(S.bowl.length < 1 || S.plate) return;
  const ids = S.bowl.map(i=>i.id).sort();
  const key = ids.join("|");
  const known = RECIPES[key];

  const tags = new Set();
  S.bowl.forEach(i => i.tags.forEach(t => tags.add(t)));
  if(known) known.add.forEach(t => tags.add(t));

  let name, isNew = false;
  if(known){
    name = known.name;
    if(!S.found.has(key)){ S.found.add(key); isNew = true; }
  } else if(S.bowl.length === 1){
    name = S.bowl[0].n + ", plain";
  } else {
    const form = FORMS.find(f => tags.has(f.tag)) || FORMS[FORMS.length-1];
    const names = S.bowl.map(i => i.n);
    const head = names.length === 2 ? names.join(" & ")
      : names.slice(0,-1).join(", ") + " & " + names[names.length-1];
    name = head + " " + form.words[hash(key) % form.words.length];
  }
  let bounty = 0;
  if(isNew){
    const top = Math.max(...ids.map(id => ING[id].tier));
    bounty = Math.round((25 + top*15 + (ids.length - 2)*20) * levelMult());
    S.shells += bounty;
  } else if(!known && !S.made.has(key)){
    bounty = Math.round((6 + Math.max(...ids.map(id => ING[id].tier))*2) * levelMult());
    S.shells += bounty;
  }
  if(!S.made.has(key)){
    S.made.set(key, {name, ids, known:!!known});
    if(!known) note("Improvised: " + name + ". Logged in the book. +" + bounty, "good");
  }

  // careful hands can hand one ingredient back
  if(S.up.thrift && S.bowl.length > 1 && Math.random() < S.up.thrift*0.09){
    const back = pick(S.bowl);
    S.stock[back.id]++;
    note("Careful hands — the " + back.n.toLowerCase() + " went back on the shelf.");
  }

  const value = S.bowl.reduce((a,i) => a + salePrice(i), 0);
  S.plate = {name, key, tags:[...tags], known:!!known, isNew, parts:S.bowl.length, value};
  S.bowl = [];
  if(isNew) note("New recipe found: " + name + ". The book pays " + bounty + " " + CUR() + ".", "good");
  drawPantry(); drawBowl(); drawPlate(); paint();
}

function scorePlate(){
  const c = S.customer, p = S.plate;
  if(c.needs){
    const have = p.key.split("|");
    const got = c.needs.filter(id => have.includes(id));
    const all = got.length === c.needs.length;
    let pay = (got.length ? 25 + 28 * got.length : 5) + p.value;
    if(all){
      pay += 15;
      if(p.known) pay += 20;
      pay += (S.up.surge || 0) * 10;
      if(S.timerOn) pay += Math.round(Math.max(0, c.left / c.total) * 16);
    }
    if(c.vip) pay *= 2;
    pay = Math.max(1, Math.round(pay * (1 + (p.parts - 1) * 0.3) * dayMult() * tipMult() *
      levelMult() * (1 + Math.min(S.streak,6) * 0.08)));
    return {pay, hits:[], bads:[], full:all, demandOk:true, needsOk:all, gotCount:got.length};
  }
  if(c.dish){
    const ok = p.key === c.dish;
    let pay = (ok ? 45 + 30 * RECIPES[c.dish].ids.length + (S.up.surge || 0) * 10 : 5) + p.value;
    if(ok && S.timerOn) pay += Math.round(Math.max(0, c.left / c.total) * 20);
    if(c.vip) pay *= 2;
    pay = Math.max(1, Math.round(pay * dayMult() * tipMult() * levelMult() *
      (1 + Math.min(S.streak,6) * 0.08)));
    return {pay, hits:[], bads:[], full:ok, demandOk:true, dishOk:ok};
  }
  const hits = c.wants.filter(t => p.tags.includes(t));
  const bads = c.avoid.filter(t => p.tags.includes(t));
  const full = hits.length === c.wants.length;

  let pay = hits.length * 18 + p.value;
  if(full) pay += 24;
  if(p.known) pay += 18;
  if(S.timerOn) pay += Math.round(Math.max(0, c.left / c.total) * 16);
  pay += (S.up.surge || 0) * 10;

  let demandOk = true;
  if(c.demand === "known" && !p.known) demandOk = false;
  if(c.demand === "big"   && p.parts < 3) demandOk = false;
  if(c.demand === "solo"  && p.parts !== 1) demandOk = false;
  if(c.demand) pay = demandOk ? pay + 28 : Math.round(pay * 0.4);

  bads.forEach(() => { pay = Math.round(pay * avoidFactor()); });
  if(hits.length === 0) pay = Math.min(pay, 6);

  const portion = 1 + (p.parts - 1) * 0.3;
  if(c.vip) pay *= 2;
  pay = Math.max(1, Math.round(pay * portion * dayMult() * tipMult() * levelMult() * (1 + Math.min(S.streak,6)*0.08)));
  return {pay, hits, bads, full, demandOk, portion};
}

function floatPay(txt){
  const n = document.createElement("div");
  n.className = "floatText";
  n.textContent = txt;
  const r = el("pantry").getBoundingClientRect();
  n.style.left = (r.left + r.width/2) + "px";
  n.style.top  = (r.top + r.height*0.35) + "px";
  document.body.appendChild(n);
  setTimeout(()=>n.remove(), 1400);
}

function serve(){
  if(!S.plate || !S.customer) return;
  const r = scorePlate();
  const c = S.customer, dish = S.plate.name;
  S.shells += r.pay;
  S.served++; S.dayServed++;

  if(c.needs){
    const named = c.needs.map(id => ING[id].n.toLowerCase()).join(" and ");
    if(r.needsOk){
      S.streak++;
      note(c.name + ' finds the ' + named + ' right where it should be. "' + dish + '." +' + r.pay, "good");
    } else if(r.gotCount){
      S.streak = 0;
      note(c.name + ' picks through it. "Some of it, at least." +' + r.pay);
    } else {
      S.streak = 0;
      note(c.name + ' hands it back. "I asked for ' + named + '." +' + r.pay, "bad");
    }
  } else if(c.dish){
    if(r.dishOk){
      S.streak++;
      note(c.name + ' gets exactly what they ordered. "' + dish + '." +' + r.pay, "good");
    } else {
      S.streak = 0;
      note(c.name + ' looks at the ' + dish.toLowerCase() + '. "I ordered the ' +
           c.dishName + '." +' + r.pay, "bad");
    }
  } else if(r.full && !r.bads.length && r.demandOk){
    S.streak++;
    note(c.name + ' clears the plate. "' + dish + ' — exactly right." +' + r.pay, "good");
  } else if(r.bads.length){
    S.streak = 0;
    note(c.name + ' picks around it. "I said nothing ' + r.bads[0] + '." +' + r.pay, "bad");
  } else if(!r.demandOk){
    S.streak = 0;
    note(c.name + " sighs. That isn't what they asked for. +" + r.pay, "bad");
  } else if(r.hits.length){
    S.streak = 0;
    note(c.name + " eats most of it. Close, not quite. +" + r.pay);
  } else {
    S.streak = 0;
    note(c.name + " stares at the " + dish.toLowerCase() + ", then at you. +" + r.pay, "bad");
  }
  floatPay("+" + r.pay);
  S.plate = null;
  drawPlate();
  advanceCustomer();
}

function walkOut(){
  const c = S.customer;
  S.customer = null; S.streak = 0; S.dayServed++;
  note(c.name + " waited long enough and left.", "bad");
  advanceCustomer();
}

function waveOff(){
  if(!S.customer) return;
  const c = S.customer;
  S.streak = 0; S.dayServed++;
  note("You wave " + c.name + " off. No hard feelings.");
  advanceCustomer();
}

/* ============================ CUSTOMERS ============================ */

function availableTags(){
  const t = new Set();
  const unlocked = new Set(pool().map(i => i.id));
  pool().forEach(i => i.tags.forEach(x => t.add(x)));
  Object.values(RECIPES).forEach(r => {
    if(r.ids.every(id => unlocked.has(id))) r.add.forEach(x => t.add(x));
  });
  return [...t];
}

function makeCustomer(){
  const person = pick(CUSTOMERS);
  const menu = [...S.found];
  const vipRoll = S.day >= 9 && Math.random() < 0.15;

  // a third of guests order a dish by name off the menu you've discovered
  if(menu.length >= 3 && Math.random() < 1/3){
    const key = pick(menu);
    const t = patienceFor(vipRoll);
    return {name:person.n, face:person.e, wants:[], avoid:[], demand:null, vip:vipRoll,
            dish:key, dishName:RECIPES[key].name, needs:null,
            total:t, left:t, ask:pick(DISH_ASKS)};
  }
  // some guests just name an ingredient they want on the plate
  if(Math.random() < 0.3){
    const stock = pool().slice();
    let want = 1;
    if(S.day >= 5 && Math.random() < 0.45) want = 2;
    if(S.day >= 10 && Math.random() < 0.2) want = 3;
    const needs = [];
    while(needs.length < Math.min(want, stock.length)){
      const ing = pick(stock);
      if(!needs.includes(ing.id)) needs.push(ing.id);
    }
    const t2 = patienceFor(vipRoll);
    return {name:person.n, face:person.e, wants:[], avoid:[], demand:null, vip:vipRoll,
            dish:null, needs, total:t2, left:t2, ask:pick(ING_ASKS)};
  }

  const tags = availableTags();
  const wants = [];
  while(wants.length < Math.min(wantsCount(), tags.length)){
    const t = pick(tags);
    if(!wants.includes(t)) wants.push(t);
  }
  const rest = tags.filter(t => !wants.includes(t));
  const avoid = [];
  if(S.day >= 4 && rest.length && Math.random() < 0.55) avoid.push(pick(rest));
  if(S.day >= 11 && rest.length > 1 && Math.random() < 0.35){
    const second = pick(rest.filter(t => !avoid.includes(t)));
    if(second) avoid.push(second);
  }
  let demand = null;
  if(S.day >= 6 && Math.random() < 0.28) demand = pick(["known","big","solo"]);
  const total = patienceFor(vipRoll);
  return {name:person.n, face:person.e, wants, avoid, demand, vip:vipRoll,
          dish:null, needs:null, total, left:total, ask:pick(ASKS)};
}

function newDay(){
  S.day++; S.dayServed = 0;
  rollPrices();
  S.arrived = receiveOrder();
  let msg = "Day " + S.day + ". The supplier posts new prices.";
  if(S.arrived.length) msg += " The truck brings: " + S.arrived.join(", ") + ".";
  if(S.up.delivery){
    const units = S.up.delivery * 3;
    const list = pool();
    const got = {};
    for(let i = 0; i < units; i++){
      const ing = pick(list);
      S.stock[ing.id]++;
      got[ing.n] = (got[ing.n]||0) + 1;
    }
    const summary = Object.entries(got).map(([k,v]) => k + " ×" + v).join(", ");
    msg += " Standing delivery: " + summary + ".";
    S.arrived.push("standing delivery — " + summary);
  }
  note(msg + " Word's getting around.", "day");
  rescueIfStuck();
  drawPantry();
  openMorning();
}

function rescueIfStuck(){
  const cheapest = Math.min(...pool().map(price));
  if(totalStock() === 0 && S.shells < cheapest){
    INGREDIENTS.filter(i => i.tier === 0).forEach(i => S.stock[i.id] += 4);
    note("The supplier takes pity and drops off a starter crate.", "good");
  }
}

function advanceCustomer(){
  if(S.dayServed >= perDay()) newDay();
  S.customer = S.onDeck || makeCustomer();
  S.customer.left = S.customer.total;
  S.onDeck = makeCustomer();
  rescueIfStuck();
  drawCustomer(); drawPantry(); paint();
}

/* ============================ RENDER ============================ */

function drawCustomer(){
  const c = S.customer;
  if(!c) return;
  el("cFace").textContent = c.face;
  el("cFace").classList.toggle("vip", !!c.vip);
  el("cName").innerHTML = c.name + (c.vip ? '<span class="badge">pays double</span>' : "");
  let txt;
  if(c.dish){
    txt = c.ask.replace(/\{d\}/g, "<u>" + c.dishName + "</u>");
  } else if(c.needs){
    const list = c.needs.map(id => "<b>" + ING[id].n.toLowerCase() + "</b>");
    const joined = list.length === 1 ? list[0]
      : list.slice(0,-1).join(", ") + " and " + list[list.length-1];
    txt = c.ask.replace(/\{i\}/g, joined);
  } else {
    txt = c.ask.replace("{w}", c.wants.map(w => "<b>" + TAG_WORDS[w] + "</b>").join(" and "));
    if(c.avoid.length) txt += " <i>Nothing " + c.avoid.map(a => TAG_WORDS[a]).join(" or ") + ".</i>";
    if(c.demand) txt += " <u>" + DEMAND_TEXT[c.demand] + "</u>";
  }
  el("cOrder").innerHTML = txt;
  el("cPatience").hidden = !S.timerOn;
  el("cNoRush").hidden = S.timerOn;
}

function drawBowl(){
  const wrap = el("slots");
  wrap.innerHTML = "";
  for(let i = 0; i < bowlSize(); i++){
    const ing = S.bowl[i];
    const s = document.createElement("div");
    s.className = "slot" + (ing ? " full" : "");
    if(ing){
      s.innerHTML = '<span aria-hidden="true">' + ing.e + '</span><span class="tip">' + ing.n + '</span>';
      s.title = "Put " + ing.n + " back on the shelf";
      s.addEventListener("click", () => {
        const back = S.bowl.splice(i,1)[0];
        S.stock[back.id]++;
        drawPantry(); drawBowl();
      });
    }
    wrap.appendChild(s);
  }
  el("bowlHint").textContent = S.bowl.length + " / " + bowlSize();
  el("combineBtn").disabled = S.bowl.length < 1 || !!S.plate;
  el("clearBtn").disabled = S.bowl.length === 0;
}

function drawPlate(){
  const box = el("plate");
  if(!S.plate){ box.classList.remove("on"); drawBowl(); return; }
  box.classList.add("on");
  el("dishName").textContent = S.plate.name;
  const c = S.customer;
  el("dishTags").innerHTML = S.plate.tags.map(t => {
    let cls = "tag";
    if(c && (c.dish || c.needs)){ /* named or ingredient order — no flavour hints */ }
    else if(c && c.wants.includes(t)) cls += " hit";
    else if(c && c.avoid.includes(t)) cls += " bad";
    return '<span class="' + cls + '">' + TAG_WORDS[t] + '</span>';
  }).join("");
  const k = el("dishKnown");
  k.className = "known" + (S.plate.isNew ? " fresh" : "");
  k.textContent = (S.plate.isNew ? "New to the book. "
                : S.plate.known ? "A menu item. " : "Improvised. ") +
                "Ingredients on the bill: " + S.plate.value + " " + CUR() + ".";
  drawBowl();
}

function note(text, cls){
  const log = el("log");
  const p = document.createElement("p");
  if(cls) p.className = cls;
  p.textContent = text;
  log.appendChild(p);
  while(log.children.length > 60) log.firstChild.remove();
  log.scrollTop = log.scrollHeight;
}

function paint(){
  el("shellCount").textContent = S.shells;
  el("dayCount").textContent = S.day;
  el("levelCount").textContent = S.level;
  el("servedCount").textContent = S.served;
  el("streakCount").textContent = S.streak;
  el("btnUp").classList.toggle("nudge", S.phase === "morning" &&
    UPGRADES.some(u => upLevel(u.id) < u.max && S.shells >= u.costs[upLevel(u.id)]));
  el("btnStock").classList.toggle("nudge", S.phase === "morning" && totalStock() < 6);
  el("walletShells").textContent = S.shells.toLocaleString() + " " + CUR();
  if(el("modal").classList.contains("on")){ drawMarket(); drawUpgrades(); drawBook(); }
}

function crateBlurb(){
  const next = INGREDIENTS.filter(i => i.tier === Math.min(upLevel("crate"), MAX_TIER) + 1).map(i => i.n);
  return next.length ? "Unlocks " + next.join(", ") + " for the truck to carry." : "Every ingredient is unlocked.";
}

/* ---------- market ---------- */

function buy(ing, qty){
  const cost = price(ing) * qty;
  if(S.shells < cost) return;
  S.shells -= cost;
  S.pendingStock[ing.id] = onOrder(ing.id) + qty;
  paint();
}

function receiveOrder(){
  const parts = [];
  Object.entries(S.pendingStock).forEach(([id,q]) => {
    if(q > 0){ S.stock[id] += q; parts.push(ING[id].n + " ×" + q); }
  });
  Object.entries(S.pendingUp).forEach(([id,n]) => {
    if(n > 0){
      S.up[id] += n;
      const u = UPGRADES.find(x => x.id === id);
      parts.push(u.t + (n > 1 ? " +" + n + " levels" : " installed"));
    }
  });
  S.pendingStock = {}; S.pendingUp = {};
  return parts;
}

function moveTag(ing){
  const raw = S.prevPrices[ing.id];
  if(raw === undefined) return "";
  const prev = Math.max(2, Math.round(raw * (1 - S.up.bulk*0.08)));
  const now = price(ing);
  if(now > prev) return '<span class="mv up"> ▲</span>';
  if(now < prev) return '<span class="mv dn"> ▼</span>';
  return '';
}

function drawMarket(){
  el("stockNote").textContent =
    "You order today, the truck delivers tomorrow morning — so buy for the day after this one. " +
    "Each card shows what a unit costs you today and, after the arrow, what it's worth on a " +
    "plate — every ingredient you cook with adds its sale price to the bill. Both re-roll " +
    "every morning. Buying today ranges " + priceLow() + " to " + priceHigh() + "; stock arrives tomorrow." +
    (S.up.bulk ? " Bulk buying is saving you a further " + (S.up.bulk*8) + "%." : "");

  const bar = el("bulkBar");
  bar.innerHTML = "";
  [3,5].forEach(q => {
    const list = pool();
    const cost = list.reduce((a,i) => a + price(i)*q, 0);
    const b = document.createElement("button");
    b.className = "buy";
    b.textContent = "×" + q + " of everything — " + cost.toLocaleString() + " " + CUR();
    b.disabled = S.shells < cost;
    b.addEventListener("click", () => {
      if(S.shells < cost) return;
      S.shells -= cost;
      list.forEach(i => S.pendingStock[i.id] = onOrder(i.id) + q);
      note("Ordered ×" + q + " of everything. It lands tomorrow morning.", "good");
      drawMarket(); paint();
    });
    bar.appendChild(b);
  });

  const wrap = el("market");
  wrap.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "mGrid";
  pool().forEach(ing => {
    const p = price(ing);
    const card = document.createElement("div");
    card.className = "mCard";
    card.innerHTML =
      '<div class="mE" aria-hidden="true">' + ing.e + '</div>' +
      '<div class="mN">' + ing.n + '</div>' +
      '<div class="mT">' + ing.tags.map(x=>TAG_WORDS[x]).join(" · ") + '</div>' +
      '<div class="mP">' + p + moveTag(ing) +
        '<span class="mSell"> → ' + salePrice(ing) + '</span></div>' +
      '<div class="mS">have ' + S.stock[ing.id] +
        (onOrder(ing.id) ? ' · <span class="onOrder">' + onOrder(ing.id) + ' coming</span>' : '') + '</div>';
    const btns = document.createElement("div");
    btns.className = "mB";
    [1,10].forEach(q => {
      const b = document.createElement("button");
      b.textContent = "+" + q;
      b.title = "Buy " + q + " at " + p + " each — arrives tomorrow";
      b.disabled = S.shells < p*q;
      b.addEventListener("click", () => { buy(ing, q); drawMarket(); });
      btns.appendChild(b);
    });
    card.appendChild(btns);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  if(maxTier() < MAX_TIER){
    const n = document.createElement("div");
    n.className = "note";
    n.style.marginTop = "1rem";
    n.textContent = "Three more ingredients unlock with each level of Upgrades → New ingredients.";
    wrap.appendChild(n);
  }
}

/* ---------- upgrades ---------- */

function drawUpgrades(){
  const wrap = el("upgrades");
  wrap.innerHTML = "";
  UPGRADES.forEach(u => {
    const lv = upLevel(u.id), pend = S.pendingUp[u.id] || 0;
    const maxed = lv >= u.max, cost = maxed ? 0 : u.costs[lv];
    const row = document.createElement("div");
    row.className = "mRow";
    row.innerHTML =
      '<div class="ic" aria-hidden="true">' + u.ic + '</div>' +
      '<div class="txt"><div class="t">' + u.t + '</div>' +
      '<div class="d">' + u.d() + '</div>' +
      '<div class="d" style="color:var(--lantern);opacity:.85">' +
        (maxed ? "Fully upgraded" : "Level " + S.up[u.id] + " of " + u.max) +
        (pend ? ' · ordered, arrives tomorrow' : '') + '</div></div>';
    const b = document.createElement("button");
    b.className = "buy";
    b.textContent = maxed ? "—" : pend ? "on the truck" : cost.toLocaleString() + " " + CUR();
    b.disabled = maxed || pend > 0 || S.shells < cost;
    b.addEventListener("click", () => {
      if(S.shells < cost || (S.pendingUp[u.id] || 0) > 0) return;
      S.shells -= cost;
      S.pendingUp[u.id] = (S.pendingUp[u.id] || 0) + 1;
      note(u.t + " ordered. It's fitted tomorrow morning — one upgrade of each kind per day.", "good");
      drawMarket(); drawUpgrades(); paint();
    });
    row.appendChild(b);
    wrap.appendChild(row);
  });
}

/* ---------- recipe book ---------- */

function drawBook(){
  const unlocked = new Set(pool().map(i => i.id));
  const improvised = [...S.made.entries()].filter(([k,v]) => !v.known);

  el("bookNote").textContent =
    S.found.size + " of " + RECIPE_TOTAL + " signature recipes found · " +
    improvised.length + " improvised plates logged · " + S.made.size +
    " combinations made in total. Every first-time discovery pays shells.";

  const wrap = el("book");
  wrap.innerHTML = "";

  const sizes = [...new Set(Object.values(RECIPES).map(r => r.ids.length))].sort();
  sizes.forEach(sz => {
    for(let t = 0; t <= MAX_TIER; t++){
      const entries = Object.entries(RECIPES).filter(([k,r]) =>
        r.ids.length === sz && Math.max(...r.ids.map(id => ING[id].tier)) === t);
      if(!entries.length) continue;
      const found = entries.filter(([k]) => S.found.has(k)).length;
      const rows = entries.map(([k,r]) => {
        const got = S.found.has(k);
        const canSee = r.ids.every(id => unlocked.has(id));
        const ings = r.ids.map(id => ING[id].e + " " + ING[id].n).join(" + ");
        if(got)    return '<div class="rec"><span class="rn">' + r.name + '</span><span class="ri">' + ings + '</span></div>';
        if(canSee) return '<div class="rec locked"><span class="rn">not yet found</span><span class="ri">' + ings + '</span></div>';
        return '<div class="rec locked"><span class="rn">not yet found</span><span class="ri">ingredients not unlocked</span></div>';
      }).join("");
      const div = document.createElement("div");
      div.innerHTML = '<div class="groupHead"><span>' + sz + '-ingredient · ' + TIER_NAMES[t] +
        '</span><span class="g2">' + found + '/' + entries.length + '</span></div>' + rows;
      wrap.appendChild(div);
    }
  });

  const div = document.createElement("div");
  let rows;
  if(improvised.length){
    rows = improvised
      .sort((a,b) => a[1].ids.length - b[1].ids.length || a[1].name.localeCompare(b[1].name))
      .map(([k,v]) => '<div class="rec improv"><span class="rn">' + v.name + '</span><span class="ri">' +
        v.ids.map(id => ING[id].e + " " + ING[id].n).join(" + ") + '</span></div>').join("");
  } else {
    rows = '<div class="rec locked"><span class="rn">nothing yet</span>' +
      '<span class="ri">any combination that isn\'t a signature recipe gets logged here</span></div>';
  }
  div.innerHTML = '<div class="groupHead"><span>Improvised plates</span><span class="g2">' +
    improvised.length + ' logged</span></div>' + rows;
  wrap.appendChild(div);
}

/* ============================ MODAL / WIRING ============================ */

const PANES = {stock:["tabStock","paneStock"], up:["tabUp","paneUp"], book:["tabBook","paneBook"]};

function ascendState(){
  const ups  = UPGRADES.filter(u => S.up[u.id] >= u.max).length;
  const recs = S.found.size;
  const done = ups === UPGRADES.length && recs >= RECIPE_TOTAL && S.shells >= ascendCost();
  return {ups, upsTotal:UPGRADES.length, recs, recsTotal:RECIPE_TOTAL,
          hasNext:S.level < WORLDS.length, ready:done};
}

function finishRun(){
  S.history.push({level:S.level, name:WORLD.name, days:S.day, served:S.served,
                  recipes:S.found.size, total:RECIPE_TOTAL, cur:CUR()});
}

function completeGame(){
  S.shells -= ascendCost();
  finishRun();
  S.completed = true;
  S.day = 1;
  note("You hand over the last of it and sign your name.", "day");
  note("Every kitchen, mastered.", "good");
  paint();
  openMorning();
}

function finaleHTML(){
  const days = S.history.reduce((a,h) => a + h.days, 0);
  const served = S.history.reduce((a,h) => a + h.served, 0);
  const dishes = S.history.reduce((a,h) => a + h.recipes, 0);
  const rows = S.history.map(h =>
    '<div class="fRow"><span class="fL">Level ' + h.level + '</span>' +
    '<span class="fN">' + h.name + '</span>' +
    '<span class="fS">' + h.days + ' days · ' + h.served + ' served · ' +
    h.recipes + '/' + h.total + ' dishes</span></div>').join("");
  return '<div class="finale">' +
    '<div class="fKiss" aria-hidden="true">🤌</div>' +
    "<h1>You've mastered every kitchen.</h1>" +
    '<p class="fLead">Five rooms, five menus, five ways of feeding people — ' +
    'and you learned all of them by heart.</p>' +
    '<div class="fList">' + rows + '</div>' +
    '<div class="fTotals"><b>' + days.toLocaleString() + '</b> days on the pass · ' +
    '<b>' + served.toLocaleString() + '</b> plates out · ' +
    '<b>' + dishes.toLocaleString() + '</b> recipes committed to memory</div>' +
    '<p class="fEnd">Chef\u2019s kiss.</p>' +
    '<p class="fSmall">The kitchen stays open. Keep cooking as long as you like.</p>' +
    '</div>';
}

function ascend(){
  const next = WORLDS[S.level];
  if(!next){ completeGame(); return; }
  finishRun();
  S.level++;
  loadWorld(S.level);
  resetForWorld(150);
  S.onDeck = makeCustomer();
  S.customer = makeCustomer();
  note("You sign the lease and walk away from the counter for the last time.", "day");
  note("Level " + S.level + ": " + WORLD.name + ". " + WORLD.blurb +
       " Everything starts over — but every plate is worth " +
       levelMult() + "× what a level 1 plate was worth.", "good");
  drawCustomer(); drawPantry(); drawBowl(); drawPlate(); paint();
  openMorning();
}

function ascendPanel(){
  const a = ascendState();
  if(S.completed) return '<p class="fBanner">Every kitchen mastered. Nothing left to prove — ' +
    'just service.</p>';
  if(!a.hasNext) return '';
  const row = (ok, txt) => '<p style="opacity:' + (ok ? 1 : .7) + '">' +
    (ok ? '✓ ' : '· ') + txt + '</p>';
  const target = WORLDS[S.level] ? "The lease on " + WORLDS[S.level].name : "The final ledger";
  let html = '<p style="margin-top:.5rem;color:var(--lantern);font-weight:600">' + target + '</p>' +
    row(a.ups === a.upsTotal, "Every upgrade maxed — " + a.ups + " of " + a.upsTotal) +
    row(a.recs >= a.recsTotal, "Every set recipe found — " + a.recs + " of " + a.recsTotal) +
    row(S.shells >= ascendCost(), ascendCost().toLocaleString() + " " + CUR() +
        " saved — " + S.shells.toLocaleString() + " so far");
  if(a.ready){
    html += '<p><button class="linkBtn" id="ascendBtn" style="font-size:.95rem;font-weight:600">' +
      (WORLDS[S.level] ? 'Buy the lease — move up to ' + WORLDS[S.level].name
                       : 'Close the books — finish the run') + '</button></p>' +
      (WORLDS[S.level] ? '<p style="opacity:.7">This clears your ' + CUR() +
        ', stock, upgrades and recipe book, and starts you again with a new pantry.</p>' : '');
  }
  return html;
}

function setPhaseUI(){
  const morning = S.phase === "morning";
  el("btnStock").disabled = !morning;
  el("btnUp").disabled = !morning;
  const why = "The truck only takes orders first thing in the morning";
  el("btnStock").title = morning ? "" : why;
  el("btnUp").title = morning ? "" : why;
  el("tabStock").hidden = !morning;
  el("tabUp").hidden = !morning;
  el("morningBox").hidden = !morning;
  el("closeBtn").textContent = morning ? "Open the counter — start day " + S.day : "Back to the counter";
}

function openMorning(){
  S.phase = "morning";
  const box = el("morningBox");
  box.innerHTML = (S.completed && S.day <= 1 ? finaleHTML() : "") +
    "<h2>Level " + S.level + " · " + WORLD.name + " · day " + S.day + "</h2>" +
    (S.arrived.length
      ? '<p class="arrived">The truck has been: ' + S.arrived.join("; ") + '.</p>'
      : '<p>Nothing on the truck this morning.</p>') +
    "<p>Place today's order and it arrives tomorrow — you're always buying a day ahead. " +
    "Upgrades work the same way. Nothing else can be ordered once the counter opens.</p>" +
    ascendPanel() +
    '<p>' + (saveOK ? "Progress saves automatically in this browser. " : "Saving is unavailable in this browser. ") +
    '<button class="linkBtn" id="resetBtn">Start a new run</button> (level 1, no upgrades, empty book)</p>';
  const ab = el("ascendBtn");
  if(ab) ab.addEventListener("click", () => {
    const q = WORLDS[S.level]
      ? "Move up to " + WORLDS[S.level].name + "? This wipes your " + CUR() +
        ", stock, upgrades and recipe book."
      : "Close the books and finish the run?";
    if(confirm(q)) ascend();
  });
  const rb = el("resetBtn");
  if(rb) rb.addEventListener("click", () => {
    if(confirm("Start over completely? This clears your level, " + CUR() +
               ", stock, every upgrade and the whole recipe book.")) wipeSave();
  });
  setPhaseUI();
  el("modal").classList.add("full");
  openModal("stock");
}

function startDay(){
  S.phase = "service";
  el("modal").classList.remove("on");
  el("modal").classList.remove("full");
  setPhaseUI();
  paint();
}
function showTab(which){
  if((which === "stock" || which === "up") && S.phase !== "morning") which = "book";
  el("walletCtx").textContent = which === "stock" ? "Day " + S.day + " prices"
    : which === "up" ? "Available to spend" : "Discoveries pay into this";
  Object.entries(PANES).forEach(([k,[tab,pane]]) => {
    el(tab).classList.toggle("on", k === which);
    el(pane).hidden = k !== which;
  });
}
function openModal(which){
  if((which === "stock" || which === "up") && S.phase !== "morning") return;
  el("walletShells").textContent = S.shells.toLocaleString() + " " + CUR();
  el("walletCtx").textContent = which === "stock" ? "Day " + S.day + " prices"
    : which === "up" ? "Available to spend" : "Discoveries pay into this";
  drawMarket(); drawUpgrades(); drawBook();
  showTab(which);
  el("modal").classList.add("on");
}
el("btnStock").addEventListener("click", () => openModal("stock"));
el("btnUp").addEventListener("click", () => openModal("up"));
el("btnBook").addEventListener("click", () => openModal("book"));
el("tabStock").addEventListener("click", () => showTab("stock"));
el("tabUp").addEventListener("click", () => showTab("up"));
el("tabBook").addEventListener("click", () => { drawBook(); showTab("book"); });
el("closeBtn").addEventListener("click", () => {
  if(S.phase === "morning") startDay(); else el("modal").classList.remove("on");
});
el("modal").addEventListener("click", e => {
  if(e.target.id === "modal" && S.phase !== "morning") el("modal").classList.remove("on");
});

el("combineBtn").addEventListener("click", combine);
el("clearBtn").addEventListener("click", () => {
  S.bowl.forEach(i => S.stock[i.id]++);
  S.bowl = [];
  drawPantry(); drawBowl();
});
el("serveBtn").addEventListener("click", serve);
el("waveBtn").addEventListener("click", waveOff);
el("binBtn").addEventListener("click", () => { note("Scraped into the bin."); S.plate = null; drawPlate(); });

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.phase !== "morning") el("modal").classList.remove("on");
  if(el("modal").classList.contains("on")) return;
  const k = e.key.toLowerCase();
  if(k === "c" && !el("combineBtn").disabled) combine();
  if(k === "s" && S.plate) serve();
});

function tick(t){
  requestAnimationFrame(tick);
  if(!S.lastT) S.lastT = t;
  let dt = (t - S.lastT)/1000;
  S.lastT = t;
  if(dt > 0.1) dt = 0.1;
  if(S.customer && S.timerOn && !el("modal").classList.contains("on")){
    S.customer.left -= dt;
    const frac = Math.max(0, S.customer.left / S.customer.total);
    const bar = el("cPatience");
    bar.firstElementChild.style.width = (frac*100) + "%";
    bar.classList.toggle("low", frac < 0.3);
    if(S.customer.left <= 0) walkOut();
  }
}

loadWorld(1);
resetForWorld(150);
if(loadGame()){
  note("Picked up where you left off — day " + S.day + ", " + S.shells + " " + CUR() + " in hand.");
  if(!S.customer) S.customer = makeCustomer();
  if(!S.onDeck)   S.onDeck   = makeCustomer();
  drawCustomer(); drawPantry(); drawBowl(); drawPlate(); setPhaseUI(); paint();
  if(S.phase === "morning") openMorning();
} else {
  note("Opening week at " + WORLD.name + ". " + WORLD.blurb +
       " The pantry has the basics — everything else comes off the truck.");
  S.onDeck = makeCustomer();
  advanceCustomer();
  drawBowl();
  openMorning();
}
saveTimer = setInterval(saveGame, 4000);
window.addEventListener("beforeunload", saveGame);
requestAnimationFrame(tick);
</script>
</body>
</html>
